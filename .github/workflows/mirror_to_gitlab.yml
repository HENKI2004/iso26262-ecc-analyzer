name: Mirror to GitLab

on:
  push:
    branches: [ master, dev ] 

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      - name: Push to GitLab
        run: |
          git push --mirror https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab2.informatik.uni-wuerzburg.de/ce/thesis/ba-linusheld/iso26262-ecc-analyzer.git
